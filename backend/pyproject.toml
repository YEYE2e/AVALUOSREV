[project]
name = "avaluos-audit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
documents = ["mcp>=1.28,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1", "pypdf>=6,<7", "python-docx>=1.2,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
